[package]
name = "ksync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.9", features = ["derive", "env"] }
ed25519-dalek = "3"
getrandom = "0.3"
hex = "0.4.3"
libc = "0.2.191"
postcard = { version = "1.2.0", features = ["use-std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "prefer-post-quantum"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = "0.26.6"
toml = "1.2.2"
webpki-roots = "1.0.12"
